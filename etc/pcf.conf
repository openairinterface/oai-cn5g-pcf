PCF =
{
    INSTANCE_ID       = @INSTANCE@;
    PID_DIRECTORY     = "@PID_DIRECTORY@";
    PCF_SLICE_CONFIG = "@PCF_SLICE_CONFIG@"; # PCF local slice config file in json format

    PCF_NAME  = "@PCF_NAME@";
    FQDN      = "@PCF_FQDN@";

    INTERFACES :
    {
        SBI: # PCF binded interface for SBI interface (e.g., communication with AMF, SMF, NRF)
        {
            INTERFACE_NAME         = "@SBI_IF_NAME@";  # STRING, interface name, YOUR NETWORK CONFIG HERE
            IPV4_ADDRESS           = "read";                                    # STRING, CIDR or "read to let app read interface configured IP address
            HTTP1_PORT             = @SBI_PORT_HTTP1@;                          # Default is 80
            HTTP2_PORT             = @SBI_PORT_HTTP2@;                          # Default is 8080
            API_VERSION            = "@SBI_API_VERSION@";                       # Default is v2
        };
    };
    # SUPPORT FEATURES
    SUPPORT_FEATURES:
    {
      # STRING, {"yes", "no"},
      REGISTER_NRF = "@REGISTER_NRF@";  # Set to yes if SMF resgisters to an NRF
      USE_FQDN     = "@USE_FQDN_DNS@";  # Set to yes if AMF/UDM/NRF/UPF will relying on a DNS to resolve FQDN
      USE_HTTP2    = "@USE_HTTP2@";     # Default: 1
    }

    NRF :
    {
      IPV4_ADDRESS = "@NRF_IPV4_ADDRESS@";  # YOUR NRF CONFIG HERE
      PORT         = @NRF_PORT@;            # YOUR NRF CONFIG HERE (default: 80)
      API_VERSION  = "@NRF_API_VERSION@";   # YOUR NRF API VERSION FOR SBI CONFIG HERE
      FQDN         = "@NRF_FQDN@"           # YOUR NRF FQDN CONFIG HERE
    };

